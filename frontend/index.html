<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PoolChanger</title>
<style>
:root{--bg:#07111f;--card:#0f1d31;--line:#213652;--txt:#eef5ff;--muted:#8fa4bf;--violet:#805cff;--blue:#36a9ff;--green:#36d59b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#17335e,transparent 34%),radial-gradient(circle at 90% 5%,#2b194f,transparent 30%),var(--bg);color:var(--txt);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:800}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--violet),var(--blue));display:grid;place-items:center}.logo:after{content:"⚡";font-size:22px}.pill{border:1px solid var(--line);background:#0c192a;padding:8px 12px;border-radius:99px;color:var(--muted)}
h1{font-size:34px;margin:0}.sub,.muted{color:var(--muted)}.sub{margin:6px 0 0}.scan{display:flex;gap:10px;margin-top:22px}.input{background:#0b1727;border:1px solid var(--line);color:var(--txt);padding:12px 14px;border-radius:12px;outline:0}.scan input{flex:1}
button{border:0;border-radius:12px;padding:12px 16px;color:white;font-weight:700;background:linear-gradient(135deg,var(--violet),#4c8fff);cursor:pointer}button:disabled{opacity:.45}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.box,.miner,.panel{background:linear-gradient(180deg,#12233ae8,#0d192ae8);border:1px solid var(--line);border-radius:18px;padding:18px}.big{font-size:25px;font-weight:800;margin-top:7px}
.miners{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}.miner.selected{border-color:#7e62ff;box-shadow:0 0 0 1px #7e62ff33}.mh{display:flex;justify-content:space-between}.name{font-weight:800;font-size:17px}.online{color:var(--green);font-size:12px;font-weight:700}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:17px 0}.metric{background:#091523;border-radius:12px;padding:10px}.metric b{display:block}.poolline{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.select{width:100%;margin-top:15px;background:#182942;border:1px solid var(--line)}
h2{font-size:19px;margin:30px 0 14px}.panel{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input{width:100%}.full{grid-column:1/-1}.switch{display:flex;align-items:center;gap:10px;color:var(--muted)}.actions{display:flex;gap:10px;align-items:center}.msg{color:var(--muted);font-size:13px}
@media(max-width:750px){.wrap{padding:16px}.stats{grid-template-columns:1fr 1fr}.panel{grid-template-columns:1fr}.full{grid-column:auto}.scan,.actions{flex-direction:column}.scan button,.actions button{width:100%}}@media(max-width:450px){.stats{grid-template-columns:1fr}.pill{display:none}}
</style></head>
<body><div class="wrap">
<header class="top"><div class="brand"><div class="logo"></div>PoolChanger</div><div id="online" class="pill">0 Miner</div></header>
<h1>Mining Dashboard</h1><p class="sub">AxeOS-Miner im LAN finden und Primary/Fallback zentral verwalten.</p>
<div class="scan"><input id="cidr" class="input" value="192.168.0.0/24"><button onclick="scan()">Miner suchen</button></div>
<div class="stats"><div class="box"><div class="muted">Hashrate</div><div id="hash" class="big">—</div></div><div class="box"><div class="muted">Temperatur Ø</div><div id="temp" class="big">—</div></div><div class="box"><div class="muted">Leistung</div><div id="power" class="big">—</div></div><div class="box"><div class="muted">Shares</div><div id="shares" class="big">—</div></div></div>
<h2>Deine Miner <span id="count" class="muted"></span></h2><div id="miners" class="miners"></div>
<h2>Pool Manager</h2>
<div class="panel">
<div class="field"><label>PRIMARY · Host / URL</label><input id="purl" class="input" placeholder="192.168.0.161"></div>
<div class="field"><label>Port</label><input id="pport" class="input" value="4567" type="number"></div>
<div class="field"><label>Primary User / Wallet</label><input id="puser" class="input"></div>
<div class="field"><label>Primary Passwort</label><input id="ppass" class="input" value="x"></div>
<div class="field"><label>FALLBACK · Host / URL</label><input id="furl" class="input" placeholder="optional"></div>
<div class="field"><label>Fallback Port</label><input id="fport" class="input" value="4567" type="number"></div>
<div class="field"><label>Fallback User / Wallet</label><input id="fuser" class="input"></div>
<div class="field"><label>Fallback Passwort</label><input id="fpass" class="input" value="x"></div>
<div class="switch full"><input id="failover" type="checkbox"> Failover/Fallback aktivieren</div>
<div class="actions full"><button id="apply" onclick="applyPool()" disabled>Pool auf Auswahl anwenden</button><span id="msg" class="msg"></span></div>
</div></div>
<script>
let miners=[];const $=id=>document.getElementById(id);
function hash(v){v=Number(v)||0;if(v>=1e12)return(v/1e12).toFixed(2)+' TH/s';if(v>=1e9)return(v/1e9).toFixed(2)+' GH/s';if(v>=1e6)return(v/1e6).toFixed(1)+' MH/s';return v?Math.round(v)+' H/s':'—'}
function render(){let b=$('miners');b.innerHTML='';miners.forEach((m,i)=>{let p=m.primary||{},f=m.fallback||{},d=document.createElement('div');d.className='miner '+(m.selected?'selected':'');d.innerHTML='<div class="mh"><div><div class="name">'+m.hostname+'</div><div class="muted">'+m.model+' · '+m.ip+' · '+m.firmware+'</div></div><div class="online">● ONLINE</div></div><div class="metrics"><div class="metric"><b>'+hash(m.hashrate)+'</b><span class="muted">1m Hashrate</span></div><div class="metric"><b>'+(m.temperature??'—')+' °C</b><span class="muted">ASIC</span></div><div class="metric"><b>'+(m.power??'—')+' W</b><span class="muted">Power</span></div></div><div class="poolline">Primary: '+(p.stratumURL||'—')+':'+(p.stratumPort||'')+'</div><div class="poolline">Fallback: '+(f.stratumURL||'—')+':'+(f.stratumPort||'')+'</div><div class="poolline">'+(m.failover?'Failover konfiguriert':'')+(m.fallbackActive?' · aktuell Fallback':'')+'</div><button class="select" onclick="toggle('+i+')">'+(m.selected?'✓ Ausgewählt':'Miner auswählen')+'</button>';b.appendChild(d)});$('count').textContent=miners.length?' · '+miners.length+' gefunden':'';$('online').textContent=miners.length+' Miner';$('apply').disabled=!miners.some(x=>x.selected);let h=miners.reduce((a,x)=>a+(Number(x.hashrate)||0),0),t=miners.filter(x=>Number.isFinite(Number(x.temperature))),s=miners.reduce((a,x)=>a+(Number(x.accepted)||0),0);$('hash').textContent=hash(h);$('temp').textContent=t.length?(t.reduce((a,x)=>a+Number(x.temperature),0)/t.length).toFixed(1)+' °C':'—';$('power').textContent=miners.reduce((a,x)=>a+(Number(x.power)||0),0)+' W';$('shares').textContent=s}
function toggle(i){miners[i].selected=!miners[i].selected;render()}
async function scan(){$('count').textContent=' · Suche …';try{let r=await fetch('/api/miners/scan?cidr='+encodeURIComponent($('cidr').value));if(!r.ok)throw Error(await r.text());miners=(await r.json()).map(x=>({...x,selected:false}));if(miners[0]){let p=miners[0].primary||{},f=miners[0].fallback||{};$('purl').value=p.stratumURL||'';$('pport').value=p.stratumPort||3333;$('puser').value=p.stratumUser||'';$('furl').value=f.stratumURL||'';$('fport').value=f.stratumPort||3333;$('fuser').value=f.stratumUser||'';$('failover').checked=miners[0].failover}render()}catch(e){$('count').textContent=' · Fehler: '+e.message}}
async function applyPool(){let selected=miners.filter(x=>x.selected).map(x=>x.ip);$('msg').textContent='Wird angewendet …';let body={miners:selected,primary:{url:$('purl').value,port:Number($('pport').value),user:$('puser').value,password:$('ppass').value},fallback:$('furl').value?{url:$('furl').value,port:Number($('fport').value),user:$('fuser').value,password:$('fpass').value}:null,failover:$('failover').checked};try{let r=await fetch('/api/pools/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let out=await r.json();$('msg').textContent=out.filter(x=>x.ok).length+' Miner aktualisiert.';setTimeout(scan,1500)}catch(e){$('msg').textContent='Fehler: '+e.message}}
scan();
</script></body></html>
